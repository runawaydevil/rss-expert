{{template "head" .}}
<body>
<a class="skip" href="#form">Skip to the form</a>

<div class="page">
	<header class="masthead">
		<a class="wordmark" href="/"><img src="{{asset "mark.png"}}" alt="" width="40" height="40" decoding="async"> rss&#8202;expert</a>
	</header>

	<main id="form">
		<form class="panel form panel-narrow" method="post" action="/account/recover">
			<h1>Set a new password</h1>

			{{if .Problem}}
			<p class="form-problem" role="alert">{{.Problem}}</p>
			{{end}}

			<input type="hidden" name="csrf" value="{{.CSRF}}">
			<input type="hidden" name="token" value="{{.Token}}">

			<label for="password">New password <span class="optional">twelve characters or more</span></label>
			<input id="password" name="password" type="password" required autofocus
				autocomplete="new-password" minlength="12">

			<button type="submit" class="button-primary">Set password</button>

			<p class="form-aside">This signs you in and ends every other session you had open.</p>
		</form>
	</main>
</div>

{{template "colophon" .}}
</body>
</html>
