{{template "head" .}}
<body>
<a class="skip" href="#form">Skip to the form</a>

<div class="page">
	<header class="masthead">
		<a class="wordmark" href="/"><img src="{{asset "mark.png"}}" alt="" width="40" height="40" decoding="async"> rss&#8202;expert</a>
	</header>

	<main id="form">
		<form class="panel form panel-narrow" method="post" action="/login">
			<h1>Sign in</h1>

			{{if .Problem}}
			<p class="form-problem" role="alert">{{.Problem}}</p>
			{{end}}

			<input type="hidden" name="csrf" value="{{.CSRF}}">

			<label for="email">Email</label>
			<input id="email" name="email" type="email" value="{{.Email}}" autocomplete="username"
				required autofocus inputmode="email" spellcheck="false">

			<label for="password">Password</label>
			<input id="password" name="password" type="password" autocomplete="current-password" required>

			<label for="code">Two-factor or recovery code
				<span class="optional">only if you switched two-factor on</span></label>
			<input id="code" name="code" type="text" autocomplete="one-time-code"
				inputmode="numeric" spellcheck="false">

			<button type="submit" class="button-primary">Sign in</button>

			<p class="form-aside">Reading needs no account. Sign in to reply, save and follow.</p>
			<p class="form-aside"><a href="/account/forgot">Sign in by email</a> ·
			<a href="/register">Create an account</a></p>
		</form>
	</main>
</div>

{{template "colophon" .}}
</body>
</html>
