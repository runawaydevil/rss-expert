services:
  rss-expert:
    image: ghcr.io/runawaydevil/rss-expert:0.0.1
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    # The port on the host comes from .env, so a stray process on the usual one
    # does not stop the container from starting. Inside, it is always 11080.
    ports:
      - "${RSS_EXPERT_HTTP_PORT:-11081}:11080"
    # A named volume, so the data directory is created with the right owner for
    # the unprivileged user this runs as. To keep the files on the host path
    # instead, swap this for "./data:/data" and run, once:
    #     mkdir -p data && sudo chown -R 65532:65532 data
    volumes:
      - data:/data
    env_file:
      - .env
    environment:
      # Inside the container the data volume is mounted at /data, whatever the
      # host path in .env says.
      RSS_EXPERT_DATA_DIR: /data
      RSS_EXPERT_LISTEN: :11080
      GOMEMLIMIT: 400MiB

volumes:
  data:
