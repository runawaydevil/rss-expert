name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install threadwalker dependencies
        working-directory: tools/threadwalker
        run: npm install --no-audit --no-fund

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: Build without cgo
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: go test ./...

      - name: Fuzz smoke
        run: |
          go test -run=XXX -fuzz=FuzzCheckAddr -fuzztime=30s ./internal/safety/
          go test -run=XXX -fuzz=FuzzCheckURL -fuzztime=30s ./internal/safety/
          go test -run=XXX -fuzz=FuzzParse -fuzztime=30s ./internal/feedin/
          go test -run=XXX -fuzz=FuzzResolveIsTotal -fuzztime=30s ./internal/convergence/
