name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install threadwalker dependencies
        working-directory: tools/threadwalker
        run: npm install --no-audit --no-fund

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: Build without cgo
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: go test ./...

      - name: Fuzz smoke
        run: |
          # The fuzzing coordinator can report "context deadline exceeded" while
          # shutting workers down at the fuzztime boundary under CI CPU pressure.
          # A real crash is written to testdata/fuzz and reproduces on every run,
          # so retrying only ever hides that transient, never a genuine finding.
          run_fuzz() {
            for attempt in 1 2 3; do
              if go test -run=XXX -fuzz="$2" -fuzztime=30s -parallel=2 "$1"; then
                return 0
              fi
              echo "::warning::fuzz $2 did not settle (attempt $attempt/3); retrying"
            done
            echo "::error::fuzz $2 failed after three attempts"
            return 1
          }
          run_fuzz ./internal/safety/ FuzzCheckAddr
          run_fuzz ./internal/safety/ FuzzCheckURL
          run_fuzz ./internal/feedin/ FuzzParse
          run_fuzz ./internal/convergence/ FuzzResolveIsTotal
